<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>共有カレンダー</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --text: #0f172a;
      --subtle: #64748b;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --dark: #1e293b;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(15,23,42,0.08);
    }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
    body { -webkit-text-size-adjust:100%; }
    .app {
      width:100%;
      max-width:1100px;
      margin:0 auto;
      padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom));
    }
    .panel {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:14px;
    }
    h1,h2,h3,p { margin:0; }

    /* header */
    .header {
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .title { font-size:22px; font-weight:800; letter-spacing:-.5px; }
    .subtitle { color:var(--subtle); font-size:13px; margin-top:4px; }
    .header-actions { display:flex; flex-wrap:wrap; gap:8px; }

    /* buttons */
    button, .file-label {
      min-height:40px;
      border:1px solid var(--line-strong);
      background:#fff;
      color:var(--text);
      border-radius:10px;
      padding:8px 14px;
      font-size:14px;
      cursor:pointer;
      text-align:center;
      white-space:nowrap;
    }
    button:active, .file-label:active { opacity:.8; }
    .btn-primary { background:var(--dark); color:#fff; border-color:var(--dark); font-weight:700; }
    .btn-danger { background:var(--danger-bg); color:var(--danger); border-color:#fca5a5; }
    .btn-sm { min-height:32px; padding:4px 10px; font-size:13px; }
    .btn-icon { min-height:36px; padding:6px 12px; }

    /* toast */
    #toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px);
      background:var(--dark); color:#fff; border-radius:999px; padding:10px 22px;
      font-size:14px; pointer-events:none; transition:transform .25s,opacity .25s; opacity:0; z-index:9999;
    }
    #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    /* layout */
    .layout { display:grid; grid-template-columns:1fr; gap:14px; }

    /* month nav */
    .month-header {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
    }
    .month-title { font-size:18px; font-weight:700; }
    .month-nav { display:flex; gap:6px; }
    .today-btn { font-size:12px; padding:4px 10px; min-height:30px; }

    /* calendar grid */
    .week-grid, .calendar-grid {
      display:grid;
      grid-template-columns:repeat(7, minmax(0,1fr));
      gap:3px;
    }
    .weekday {
      text-align:center; font-size:11px; font-weight:700;
      color:var(--subtle); padding-bottom:4px;
    }
    .weekday.sun { color:#ef4444; }
    .weekday.sat { color:#3b82f6; }
    .day {
      min-height:68px;
      border:1.5px solid var(--line);
      border-radius:10px;
      padding:5px;
      background:#fff;
      cursor:pointer;
      text-align:left;
      overflow:hidden;
      transition:border-color .15s, background .15s;
    }
    .day:hover { border-color:#94a3b8; }
    .day.other-month { opacity:.4; }
    .day.selected { background:var(--blue-soft); border-color:var(--blue); }
    .day.today-cell { border-color:#94a3b8; }
    .day-top { display:flex; justify-content:space-between; align-items:flex-start; }
    .day-num { font-size:13px; font-weight:700; line-height:1.2; }
    .day-num.is-today {
      display:inline-flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:50%;
      background:var(--dark); color:#fff; font-size:12px;
    }
    .day-num.sun { color:#ef4444; }
    .day-num.sat { color:#3b82f6; }
    .more-badge {
      font-size:10px; color:var(--subtle); padding:0 2px;
    }
    .preview-pill {
      margin-top:3px;
      font-size:10px;
      line-height:1.3;
      border-radius:6px;
      padding:2px 5px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-weight:600;
    }
    /* member colors */
    .cat-みんな  { background:#e2e8f0; color:#334155; }
    .cat-自分    { background:#dbeafe; color:#1d4ed8; }
    .cat-家族    { background:#dcfce7; color:#15803d; }
    .cat-友だち  { background:#fce7f3; color:#9d174d; }
    .cat-仕事    { background:#fef9c3; color:#a16207; }

    /* form */
    .form-grid { display:grid; grid-template-columns:1fr; gap:10px; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    label { font-size:13px; font-weight:700; color:var(--subtle); }
    input, select, textarea {
      width:100%; min-height:40px;
      border:1.5px solid var(--line-strong); border-radius:10px;
      padding:8px 12px; font-size:15px;
      background:#fff; color:var(--text);
      transition:border-color .15s;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--blue); }
    textarea { min-height:80px; resize:vertical; }
    .form-actions { display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
    #cancelEditBtn { display:none; }

    /* section title */
    .section-title { font-size:16px; font-weight:700; margin-bottom:12px; }

    /* event card */
    .event-card {
      border:1.5px solid var(--line); border-radius:12px; padding:12px;
      margin-bottom:10px; transition:border-color .15s;
    }
    .event-card:hover { border-color:#94a3b8; }
    .event-head {
      display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    }
    .event-left { flex:1; min-width:0; }
    .event-title-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
    .event-name { font-weight:700; font-size:15px; }
    .member-badge {
      border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700;
    }
    .event-time { font-size:13px; color:var(--subtle); }
    .event-note { font-size:13px; color:var(--subtle); margin-top:3px; }
    .event-actions { display:flex; gap:6px; flex-shrink:0; }

    /* empty state */
    .empty { color:var(--subtle); font-size:14px; text-align:center; padding:20px 0; }

    .hidden { display:none; }

    @media (min-width:700px) {
      .app { padding:20px; }
      .header { flex-direction:row; justify-content:space-between; align-items:flex-start; }
      .layout { grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr); }
      .day { min-height:90px; padding:7px; }
      .week-grid,.calendar-grid { gap:5px; }
      .preview-pill { font-size:11px; }
      .month-title { font-size:20px; }
      .title { font-size:26px; }
      .form-grid { grid-template-columns:1fr 1fr; }
      .form-group.full { grid-column:1/-1; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- header -->
  <div class="panel">
    <div class="header">
      <div>
        <h1 class="title">📅 共有カレンダー</h1>
        <p class="subtitle">予定の追加・編集・削除ができます。データはブラウザに保存されます。</p>
      </div>
      <div class="header-actions">
        <button id="exportButton" class="btn-icon">書き出し</button>
        <label class="file-label btn-icon">読み込み
          <input id="importInput" class="hidden" type="file" accept="application/json" />
        </label>
      </div>
    </div>
  </div>

  <div class="layout">
    <!-- calendar -->
    <div class="panel">
      <div class="month-header">
        <h2 id="monthTitle" class="month-title"></h2>
        <div class="month-nav">
          <button id="todayButton" class="today-btn">今日</button>
          <button id="prevMonthButton" class="btn-icon">←</button>
          <button id="nextMonthButton" class="btn-icon">→</button>
        </div>
      </div>
      <div class="week-grid" id="weekdayRow"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- sidebar -->
    <div>
      <!-- form -->
      <div class="panel">
        <h2 id="formTitle" class="section-title">予定を追加</h2>
        <div class="form-grid">
          <div class="form-group full">
            <label for="titleInput">予定名 *</label>
            <input id="titleInput" placeholder="例: 会議、病院、ごはん" />
          </div>
          <div class="form-group">
            <label for="dateInput">日付 *</label>
            <input id="dateInput" type="date" />
          </div>
          <div class="form-group">
            <label for="timeInput">時間</label>
            <input id="timeInput" type="time" />
          </div>
          <div class="form-group">
            <label for="memberInput">カテゴリ</label>
            <select id="memberInput">
              <option>みんな</option>
              <option>自分</option>
              <option>家族</option>
              <option>友だち</option>
              <option>仕事</option>
            </select>
          </div>
          <div class="form-group full">
            <label for="noteInput">メモ</label>
            <textarea id="noteInput" placeholder="場所、持ち物、補足など"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button id="submitButton" class="btn-primary">追加する</button>
          <button id="cancelEditBtn">キャンセル</button>
        </div>
      </div>

      <!-- event list for selected date -->
      <div class="panel">
        <h2 id="selectedDateTitle" class="section-title"></h2>
        <div id="selectedEvents"></div>
      </div>
    </div>
  </div>

</div>

<!-- toast -->
<div id="toast"></div>

<script>
  const STORAGE_KEY = "shared-calendar-v2";
  const MEMBER_OPTIONS = ["みんな","自分","家族","友だち","仕事"];

  function pad(n) { return String(n).padStart(2,"0"); }
  function toDateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function fromDateKey(s) {
    const p = String(s||"").split("-").map(Number);
    if (p.length!==3||p.some(isNaN)) return new Date();
    return new Date(p[0],p[1]-1,p[2]);
  }
  function monthLabel(d) { return `${d.getFullYear()}年 ${d.getMonth()+1}月`; }
  function buildCells(viewDate) {
    const first = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    const start = new Date(first);
    start.setDate(first.getDate()-first.getDay());
    return Array.from({length:42},(_,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); return d; });
  }
  function uid() {
    return (typeof crypto!=="undefined"&&crypto.randomUUID)?crypto.randomUUID():`id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }
  function normalizeEvent(e) {
    return {
      id: typeof e?.id==="string"&&e.id?e.id:uid(),
      title: typeof e?.title==="string"?e.title.trim():"",
      date: /^\d{4}-\d{2}-\d{2}$/.test(e?.date)?e.date:toDateKey(new Date()),
      time: typeof e?.time==="string"?e.time:"",
      member: MEMBER_OPTIONS.includes(e?.member)?e.member:"みんな",
      note: typeof e?.note==="string"?e.note.trim():"",
    };
  }

  function loadEvents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultEvents();
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return defaultEvents();
      const evs = arr.map(normalizeEvent).filter(e=>e.title);
      return evs.length?evs:defaultEvents();
    } catch { return defaultEvents(); }
  }
  function defaultEvents() {
    const today = toDateKey(new Date());
    return [
      {id:uid(),title:"買い物",date:today,time:"18:00",member:"家族",note:"スーパーで夕飯の材料"},
      {id:uid(),title:"打ち合わせ",date:today,time:"10:00",member:"仕事",note:"オンライン"},
    ];
  }
  function saveEvents() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.events)); } catch {}
  }

  const state = {
    now: new Date(),
    viewDate: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    selectedDate: toDateKey(new Date()),
    events: loadEvents(),
    editingId: null,
  };

  // DOM refs
  const $ = id => document.getElementById(id);
  const monthTitleEl   = $("monthTitle");
  const weekdayRowEl   = $("weekdayRow");
  const calendarGridEl = $("calendarGrid");
  const selectedDateTitleEl = $("selectedDateTitle");
  const selectedEventsEl    = $("selectedEvents");
  const titleInput   = $("titleInput");
  const dateInput    = $("dateInput");
  const timeInput    = $("timeInput");
  const memberInput  = $("memberInput");
  const noteInput    = $("noteInput");
  const submitButton  = $("submitButton");
  const cancelEditBtn = $("cancelEditBtn");
  const formTitleEl   = $("formTitle");
  const toastEl       = $("toast");

  // toast
  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 2200);
  }

  // form state
  function enterEditMode(event) {
    state.editingId = event.id;
    titleInput.value  = event.title;
    dateInput.value   = event.date;
    timeInput.value   = event.time;
    memberInput.value = event.member;
    noteInput.value   = event.note;
    submitButton.textContent = "更新する";
    formTitleEl.textContent  = "予定を編集";
    cancelEditBtn.style.display = "";
    titleInput.focus();
    formTitleEl.scrollIntoView({behavior:"smooth",block:"start"});
  }
  function exitEditMode() {
    state.editingId = null;
    titleInput.value  = "";
    timeInput.value   = "";
    memberInput.value = "みんな";
    noteInput.value   = "";
    dateInput.value   = state.selectedDate;
    submitButton.textContent = "追加する";
    formTitleEl.textContent  = "予定を追加";
    cancelEditBtn.style.display = "none";
  }

  function submitForm() {
    const ev = normalizeEvent({
      id:     state.editingId || uid(),
      title:  titleInput.value,
      date:   dateInput.value,
      time:   timeInput.value,
      member: memberInput.value,
      note:   noteInput.value,
    });
    if (!ev.title) { showToast("予定名を入力してください"); titleInput.focus(); return; }

    if (state.editingId) {
      state.events = state.events.map(e => e.id===state.editingId?ev:e);
      showToast("予定を更新しました");
    } else {
      state.events.push(ev);
      showToast("予定を追加しました");
    }
    state.selectedDate = ev.date;
    saveEvents();
    exitEditMode();
    render();
  }

  function deleteEvent(id) {
    state.events = state.events.filter(e=>e.id!==id);
    if (state.editingId===id) exitEditMode();
    saveEvents();
    showToast("予定を削除しました");
    render();
  }

  function exportJson() {
    try {
      const blob = new Blob([JSON.stringify(state.events,null,2)],{type:"application/json"});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "calendar-events.json";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      showToast("書き出しました");
    } catch { showToast("書き出しに失敗しました"); }
  }

  function importJson(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const arr = JSON.parse(String(reader.result||"[]"));
        if (!Array.isArray(arr)) { showToast("形式が正しくありません"); return; }
        state.events = arr.map(normalizeEvent).filter(e=>e.title);
        saveEvents(); showToast("読み込みました"); render();
      } catch { showToast("読み込みに失敗しました"); }
    };
    reader.readAsText(file);
  }

  // render
  function renderWeekdays() {
    const days = [
      {label:"日",cls:"sun"},{label:"月",cls:""},{label:"火",cls:""},
      {label:"水",cls:""},{label:"木",cls:""},{label:"金",cls:""},{label:"土",cls:"sat"},
    ];
    weekdayRowEl.innerHTML = "";
    days.forEach(({label,cls})=>{
      const el = document.createElement("div");
      el.className = "weekday" + (cls?" "+cls:"");
      el.textContent = label;
      weekdayRowEl.appendChild(el);
    });
  }

  function renderCalendar() {
    const todayKey = toDateKey(state.now);
    const cells    = buildCells(state.viewDate);
    const byDate   = {};
    state.events.forEach(e => { (byDate[e.date]||(byDate[e.date]=[])).push(e); });

    calendarGridEl.innerHTML = "";
    monthTitleEl.textContent = monthLabel(state.viewDate);

    cells.forEach(date => {
      const key = toDateKey(date);
      const dow = date.getDay();
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day";
      if (date.getMonth()!==state.viewDate.getMonth()) btn.classList.add("other-month");
      if (key===state.selectedDate) btn.classList.add("selected");
      if (key===todayKey) btn.classList.add("today-cell");

      btn.addEventListener("click",()=>{
        state.selectedDate = key;
        if (!state.editingId) dateInput.value = key;
        render();
        selectedDateTitleEl.closest(".panel").scrollIntoView({behavior:"smooth",block:"start"});
      });

      const top = document.createElement("div");
      top.className = "day-top";

      const numEl = document.createElement("span");
      numEl.className = "day-num";
      if (key===todayKey) numEl.classList.add("is-today");
      else if (dow===0) numEl.classList.add("sun");
      else if (dow===6) numEl.classList.add("sat");
      numEl.textContent = String(date.getDate());
      top.appendChild(numEl);

      const evList = byDate[key]||[];
      if (evList.length>2) {
        const more = document.createElement("span");
        more.className = "more-badge";
        more.textContent = `+${evList.length}`;
        top.appendChild(more);
      }
      btn.appendChild(top);

      evList.slice(0,2).forEach(ev => {
        const pill = document.createElement("div");
        pill.className = `preview-pill cat-${ev.member}`;
        pill.textContent = `${ev.time?ev.time+" ":""}${ev.title}`;
        btn.appendChild(pill);
      });

      calendarGridEl.appendChild(btn);
    });
  }

  function renderSelectedEvents() {
    const d = fromDateKey(state.selectedDate);
    selectedDateTitleEl.textContent = `${d.getMonth()+1}月${d.getDate()}日の予定`;
    selectedEventsEl.innerHTML = "";

    const list = (state.events.filter(e=>e.date===state.selectedDate))
      .sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));

    if (!list.length) {
      const el = document.createElement("div");
      el.className = "empty";
      el.textContent = "予定はありません";
      selectedEventsEl.appendChild(el);
      return;
    }

    list.forEach(ev => {
      const card = document.createElement("div");
      card.className = "event-card";

      const head = document.createElement("div");
      head.className = "event-head";

      const left = document.createElement("div");
      left.className = "event-left";

      const titleRow = document.createElement("div");
      titleRow.className = "event-title-row";

      const name = document.createElement("span");
      name.className = "event-name";
      name.textContent = ev.title;
      titleRow.appendChild(name);

      const badge = document.createElement("span");
      badge.className = `member-badge cat-${ev.member}`;
      badge.textContent = ev.member;
      titleRow.appendChild(badge);
      left.appendChild(titleRow);

      if (ev.time) {
        const t = document.createElement("div");
        t.className = "event-time";
        t.textContent = ev.time;
        left.appendChild(t);
      }
      if (ev.note) {
        const n = document.createElement("div");
        n.className = "event-note";
        n.textContent = ev.note;
        left.appendChild(n);
      }

      const actions = document.createElement("div");
      actions.className = "event-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "btn-sm";
      editBtn.textContent = "編集";
      editBtn.addEventListener("click",()=>enterEditMode(ev));

      const delBtn = document.createElement("button");
      delBtn.className = "btn-sm btn-danger";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click",()=>deleteEvent(ev.id));

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      head.appendChild(left);
      head.appendChild(actions);
      card.appendChild(head);
      selectedEventsEl.appendChild(card);
    });
  }

  function render() {
    renderCalendar();
    renderSelectedEvents();
  }

  // events
  submitButton.addEventListener("click", submitForm);
  cancelEditBtn.addEventListener("click",()=>{ exitEditMode(); render(); });
  $("todayButton").addEventListener("click",()=>{
    state.viewDate = new Date(state.now.getFullYear(), state.now.getMonth(), 1);
    state.selectedDate = toDateKey(state.now);
    exitEditMode();
    render();
  });
  $("prevMonthButton").addEventListener("click",()=>{
    state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth()-1, 1);
    render();
  });
  $("nextMonthButton").addEventListener("click",()=>{
    state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth()+1, 1);
    render();
  });
  $("exportButton").addEventListener("click", exportJson);
  $("importInput").addEventListener("change",e=>importJson(e.target.files&&e.target.files[0]));

  // init
  dateInput.value = state.selectedDate;
  renderWeekdays();
  render();
</script>
</body>
</html>
